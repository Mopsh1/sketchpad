# XcodeGen spec — regenerate Sketchpad.xcodeproj with `xcodegen generate` (or `make project`).
name: Sketchpad
options:
  bundleIdPrefix: com.mopshi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Signed ad hoc so it runs on the Mac that builds it; no Apple developer account, no sandbox.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Sketchpad:
    type: application
    platform: macOS
    sources:
      - path: Sketchpad
      # The Excalidraw page, built by `make web`. Copied as one folder into Contents/Resources/dist.
      - path: web/dist
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Sketchpad/Info.plist
      properties:
        CFBundleDisplayName: Sketchpad
        # The UI is written in Traditional Chinese; this makes AppKit's own menus match.
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Mopshi. MIT License."
        CFBundleDocumentTypes:
          - CFBundleTypeName: Excalidraw 白板
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [com.excalidraw.excalidraw]
        # excalidraw.com owns the .excalidraw format, so it is imported rather than exported.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.excalidraw.excalidraw
            UTTypeDescription: Excalidraw 白板
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
              public.mime-type: [application/vnd.excalidraw+json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mopshi.Sketchpad
        PRODUCT_NAME: Sketchpad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  SketchpadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SketchpadTests
    dependencies:
      - target: Sketchpad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mopshi.SketchpadTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sketchpad.app/Contents/MacOS/Sketchpad
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Sketchpad:
    build:
      targets:
        Sketchpad: all
        SketchpadTests: [test]
    test:
      targets:
        - SketchpadTests
